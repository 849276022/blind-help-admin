<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>南宁地铁无障碍护航·公安调度台</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#081326;color:#e8f0fa;font:14px Microsoft YaHei,Arial,sans-serif}button{cursor:pointer;border:0}.top{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#123d69,#0b213e);box-shadow:0 2px 12px #0006}.brand{font-size:20px;font-weight:700}.brand small{font-size:12px;color:#9bb7d3;margin-left:12px}.top-right{color:#b8cbe0}.layout{height:calc(100vh - 64px);padding:18px;display:grid;grid-template-columns:220px minmax(320px,1fr) 390px;grid-template-rows:1fr 150px;gap:16px}.side,.orders,.logs,.map{border:1px solid #1d3b5b;background:#0c1c31;border-radius:12px}.side{padding:14px}.section-title{font-size:16px;font-weight:700;margin-bottom:14px}.voice{padding:14px;border-radius:10px;background:linear-gradient(135deg,#223f77,#3b2660);margin-bottom:14px}.voice-title{font-weight:700;margin-bottom:8px}.voice-status{color:#bed0e4;font-size:12px;line-height:1.5;min-height:36px}.voice-btn{width:100%;padding:11px;border-radius:8px;background:#3d8bea;color:#fff;margin-top:10px}.voice-btn:disabled{opacity:.6}.voice-btn.recording{background:#e04d6a}.metric{padding:13px 10px;border-top:1px solid #1b3652}.metric label{color:#94acc5;font-size:12px}.metric strong{display:block;font-size:28px;color:#fff;margin-top:5px}.map{position:relative;overflow:hidden;background-color:#0c2035;background-image:linear-gradient(#1c4258 1px,transparent 1px),linear-gradient(90deg,#1c4258 1px,transparent 1px);background-size:42px 42px}.map:after{content:'地图区域（后续接入真实地铁地图）';position:absolute;inset:0;display:grid;place-items:center;color:#6e91ae;font-size:16px;pointer-events:none}.marker{position:absolute;z-index:1;font-size:24px}.orders{padding:16px;overflow:auto}.filters{display:flex;gap:6px;margin-bottom:12px}.filter{padding:7px 10px;border-radius:6px;background:#17304b;color:#a9c0d7;font-size:12px}.filter.active{background:#2675bd;color:#fff}.card{padding:13px;margin-bottom:10px;border:1px solid #1c3a58;border-radius:9px;background:#102640}.card-head{display:flex;justify-content:space-between;gap:8px}.oid{font-weight:700;color:#9fd1ff}.status{font-size:12px;padding:3px 7px;border-radius:10px;background:#684b20;color:#ffd27d}.status.assigned,.status.arrived{background:#164c70;color:#8fd5ff}.status.completed{background:#18583f;color:#9af0c1}.status.cancelled{background:#49353b;color:#dbadb6}.content{margin:10px 0;color:#fff}.meta{color:#9bb1c7;font-size:12px;line-height:1.8}.actions{display:flex;gap:7px;margin-top:10px}.action{padding:7px 10px;border-radius:6px;color:#fff;background:#2377bd;font-size:12px}.action.green{background:#218758}.action.gray{background:#4b5e70}.empty{padding:40px 10px;text-align:center;color:#7893ac}.logs{grid-column:1/4;padding:14px;overflow:auto}.log{display:inline-flex;gap:10px;margin:5px 18px 5px 0;color:#9bb1c7;font-size:12px}.log b{color:#6da9dc}.order-audio{max-width:100%;height:30px;margin-top:8px}
@media(max-width:1000px){.layout{grid-template-columns:190px 1fr;grid-template-rows:1fr 220px}.orders{grid-column:2}.logs{grid-column:1/3}.map{display:none}}@media(max-width:650px){.layout{display:block;height:auto}.side,.orders,.logs{margin-bottom:14px}.top{padding:0 12px}.top-right{font-size:11px}}
</style>
</head>
<body>
<header class="top"><div class="brand">🚇 南宁地铁无障碍护航 <small>公安调度控制台</small></div><div class="top-right" id="clock">--</div></header>
<main class="layout">
<aside class="side"><div class="section-title">实时调度</div><div class="voice"><div class="voice-title">🎤 盲人语音求助</div><div class="voice-status" id="voiceStatus">云端工单接入后，新求助会自动显示在右侧列表</div><button class="voice-btn" id="voiceBtn">模拟接收语音</button></div><div class="metric"><label>待处理工单</label><strong id="waiting">0</strong></div><div class="metric"><label>处理中工单</label><strong id="processing">0</strong></div><div class="metric"><label>今日完成</label><strong id="completed">0</strong></div><div class="metric"><label>数据状态</label><strong id="dataMode" style="font-size:16px">演示模式</strong></div></aside>
<section class="map"><span class="marker" style="left:28%;top:35%">🚶</span><span class="marker" style="left:64%;top:55%">👮</span><span class="marker" style="left:48%;top:24%">🚇</span></section>
<section class="orders"><div class="section-title">📋 求助工单 <span id="total" style="float:right;color:#8fa9c2;font-size:12px;font-weight:400"></span></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="waiting">待处理</button><button class="filter" data-filter="active">处理中</button><button class="filter" data-filter="completed">已完成</button></div><div id="orderList"></div></section>
<section class="logs"><div class="section-title">📝 操作日志</div><div id="logList"></div></section>
</main>
<script>
const cfg=window.APP_CONFIG||{};const API=cfg.API_BASE_URL||'';let online=false,orders=[],logs=[];let filter='all';
const demo=[{id:'DEMO001',status:'waiting',content:'我在朝阳广场地铁站，需要工作人员接应',station:'朝阳广场',userName:'演示求助者',createdAt:'刚刚'},{id:'DEMO002',status:'assigned',content:'需要帮助前往广西大学',station:'广西大学',userName:'演示用户',assignee:'工作人员A',createdAt:'10:25'}];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(o){return {...o,id:o.id||o.orderId,station:o.station||o.location||'待确认',content:o.content||o.transcript||'语音求助（待识别）',userName:o.userName||o.user||'匿名求助者',createdAt:o.createdAt||o.time||'--:--'}}
function status(s){return {waiting:['待处理',''],assigned:['已派单','assigned'],arrived:['已到达','arrived'],completed:['已完成','completed'],cancelled:['已取消','cancelled']}[s]||['未知','']}
function render(){let list=filter==='all'?orders:filter==='active'?orders.filter(o=>['assigned','arrived'].includes(o.status)):orders.filter(o=>o.status===filter);$('total').textContent='共 '+orders.length+' 条';$('orderList').innerHTML=list.length?list.map(card).join(''):'<div class="empty">暂无工单</div>';let w=orders.filter(o=>o.status==='waiting').length,a=orders.filter(o=>['assigned','arrived'].includes(o.status)).length,c=orders.filter(o=>o.status==='completed').length;$('waiting').textContent=w;$('processing').textContent=a;$('completed').textContent=c;$('dataMode').textContent=online?'云端同步':'演示模式';$('logList').innerHTML=logs.slice(0,16).map(x=>'<span class="log"><b>'+esc(x.time)+'</b>'+esc(x.text)+'</span>').join('')||'<span class="empty">暂无日志</span>'}
function card(o){let st=status(o.status),action='';if(o.status==='waiting')action='<button class="action" onclick="change(\''+esc(o.id)+'\',\'assigned\')">派单</button>';if(o.status==='assigned')action='<button class="action" onclick="change(\''+esc(o.id)+'\',\'arrived\')">确认到达</button>';if(o.status==='arrived')action='<button class="action green" onclick="change(\''+esc(o.id)+'\',\'completed\')">完成护航</button>';return '<article class="card"><div class="card-head"><span class="oid">'+esc(o.id)+'</span><span class="status '+st[1]+'">'+st[0]+'</span></div><div class="content">'+esc(o.content)+'</div><div class="meta">👤 '+esc(o.userName)+'　📍 '+esc(o.station)+'　🕒 '+esc(o.createdAt)+'</div>'+(o.audioUrl?'<audio class="order-audio" controls src="'+esc(o.audioUrl)+'"></audio>':'')+(action?'<div class="actions">'+action+'<button class="action gray" onclick="change(\''+esc(o.id)+'\',\'cancelled\')">取消</button></div>':'')+'</article>'}
async function load(){if(!API){orders=demo.map(normalize);render();return}try{let r=await fetch(API+'/help-orders');if(!r.ok)throw Error(r.status);let p=await r.json();orders=(p.data||[]).map(normalize);online=true;logs.unshift({time:new Date().toLocaleTimeString(),text:'已同步云端工单'});render()}catch(e){online=false;if(!orders.length)orders=demo.map(normalize);logs.unshift({time:new Date().toLocaleTimeString(),text:'云端暂不可用，当前使用演示数据'});render()}}
async function change(id,next){let o=orders.find(x=>x.id===id);if(!o)return;o.status=next;logs.unshift({time:new Date().toLocaleTimeString(),text:'工单 '+id+' 已更新为 '+status(next)[0]});render();if(online){try{let r=await fetch(API+'/help-orders/'+encodeURIComponent(id)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:next,operator:'调度员'})});if(!r.ok)throw Error(r.status)}catch(e){alert('云端状态同步失败，请检查后端接口');}}}
$('voiceBtn').onclick=()=>{let b=$('voiceBtn');b.disabled=true;b.textContent='正在接收...';$('voiceStatus').textContent='正在等待云端语音工单';setTimeout(()=>{let o=normalize({id:'DEMO'+Date.now().toString().slice(-6),status:'waiting',content:'我在地铁站，需要工作人员帮助',station:'待语音识别',userName:'语音求助者',createdAt:'刚刚'});orders.unshift(o);logs.unshift({time:new Date().toLocaleTimeString(),text:'收到新的盲人语音求助 '+o.id});$('voiceStatus').textContent='已生成待处理工单';b.disabled=false;b.textContent='再次接收语音';render()},800)};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});setInterval(()=>{$('clock').textContent=new Date().toLocaleString('zh-CN')},1000);load();setInterval(load,Number(cfg.POLL_INTERVAL_MS)||5000);
</script></body></html>
